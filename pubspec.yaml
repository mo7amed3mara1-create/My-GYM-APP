name: azm_gym
description: "A complete offline Gym Management App in Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  file_picker: ^8.0.5
  fl_chart: ^0.68.0
  crypto: ^3.0.3
  google_fonts: ^6.2.1
  csv: ^6.0.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
